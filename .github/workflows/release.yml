name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2

      # ring needs a C compiler for the musl target
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo test --locked
      - run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          mkdir dist
          cp "target/$TARGET/release/vortexlinux" dist/vortexlinux-x86_64-linux
          cd dist
          sha256sum vortexlinux-x86_64-linux > vortexlinux-x86_64-linux.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
